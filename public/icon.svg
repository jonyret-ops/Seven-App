<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Dial Track Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272A" stroke-width="28"/>

  <!-- Dial Progress Arc (Emerald) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#emeraldGlow)" stroke-width="32"
          stroke-linecap="round" stroke-dasharray="1131" stroke-dashoffset="320"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Accent indicator dot -->
  <circle cx="436" cy="256" r="18" fill="#34D399" filter="url(#glow)"/>

  <!-- Center Stylized 7 -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, Roboto, sans-serif"
        font-size="220" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-8">7</text>
</svg>

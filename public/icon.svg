<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2533"/>
      <stop offset="50%" stop-color="#0F141E"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Dial Track Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1F2937" stroke-width="28"/>

  <!-- Dial Progress Arc (Electric Blue Gradient) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#blueGradient)" stroke-width="32"
          stroke-linecap="round" stroke-dasharray="1131" stroke-dashoffset="320"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Accent indicator dot (Electric Cyan/Blue) -->
  <circle cx="436" cy="256" r="18" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Center Stylized 7 -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, Roboto, sans-serif"
        font-size="220" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-8">7</text>
</svg>
